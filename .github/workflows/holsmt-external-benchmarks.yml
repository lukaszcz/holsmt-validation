name: holsmt-external-benchmarks

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "tools/**"
      - ".github/workflows/holsmt-external-benchmarks.yml"
  push:
    branches:
      - "main"
    paths:
      - "tools/**"
      - ".github/workflows/holsmt-external-benchmarks.yml"
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

env:
  HOLSMT_SOURCE_REF: a3008a44b556c6b29367b52f8869205cb3370cf6
  HOLSMT_ROOT: ${{ github.workspace }}/hol-source
  HOLSMT_VALIDATION_DIR: ${{ github.workspace }}

jobs:
  curated-small:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout pinned HolSmt source
        uses: actions/checkout@v5
        with:
          repository: lukaszcz/HOL
          ref: ${{ env.HOLSMT_SOURCE_REF }}
          path: hol-source

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build HOL with Z3 and cvc5
        uses: docker/build-push-action@v7
        with:
          context: hol-source
          file: hol-source/developers/docker-ci/Dockerfile
          push: false
          load: true
          tags: holsmt-external:ci
          build-args: |
            SML=poly
            Z3_VERSION=4.13.0
            CVC_VERSION=5
            BUILDOPTS=--no-cache --expk -j4

      - name: Validate pinned external benchmark importer
        run: python3 tools/import_external_benchmarks.py --check >/tmp/holsmt-pinned-external-manifest.json

      - name: Run curated external benchmark slice
        run: |
          python3 tools/run_conformance_suite.py \
            --no-default-suite \
            --benchmark-dir tools/external-benchmarks/curated-small \
            --mode parser-only \
            --out /tmp/holsmt-curated-external

      - name: Run curated string conformance slice
        run: |
          docker run --rm \
            -e HOLSMT_ROOT=/ML/HOL \
            -e HOLSMT_VALIDATION_DIR=/validation \
            -v "$PWD:/validation:ro" \
            holsmt-external:ci \
            sh -lc 'python3 /validation/tools/run_conformance_suite.py \
              --no-default-suite \
              --benchmark-dir \
                /validation/tools/external-benchmarks/curated-small/strings \
              --out /tmp/holsmt-curated-strings'

      - name: Run curated higher-order cvc5 oracle slice
        run: |
          docker run --rm \
            -e HOLSMT_ROOT=/ML/HOL \
            -e HOLSMT_VALIDATION_DIR=/validation \
            -v "$PWD:/validation:ro" \
            holsmt-external:ci \
            sh -lc 'python3 /validation/tools/run_conformance_suite.py \
              --no-default-suite \
              --benchmark-dir /validation/tools/external-benchmarks/ho \
              --mode parser-only \
              --mode cvc5-oracle \
              --out /tmp/holsmt-curated-ho-cvc5'

      - name: Run lowerable higher-order Z3_TAC spot checks
        run: |
          docker run --rm \
            -e HOLSMT_ROOT=/ML/HOL \
            -e HOLSMT_VALIDATION_DIR=/validation \
            -v "$PWD:/validation:ro" \
            holsmt-external:ci \
            sh -lc 'python3 /validation/tools/run_conformance_suite.py \
              --no-default-suite \
              --benchmark-dir \
                /validation/tools/external-benchmarks/ho/tptp_function_extensionality.smt2 \
              --benchmark-dir \
                /validation/tools/external-benchmarks/ho/tptp_lambda_beta.smt2 \
              --mode parser-only \
              --mode z3-tac \
              --out /tmp/holsmt-curated-ho-z3-tac'

      - name: Run HolSmt tool tests
        run: python3 -m unittest tools/tests/test_run_conformance_suite.py

  scheduled-large:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      HOLSMT_LARGE_BENCHMARK_DIR: ${{ vars.HOLSMT_LARGE_BENCHMARK_DIR }}
      HOLSMT_Z3_PROOF_DIR: ${{ vars.HOLSMT_Z3_PROOF_DIR }}
      HOLSMT_REGRESSION_DIR: ${{ vars.HOLSMT_REGRESSION_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run configured large external benchmark slice
        run: |
          args=(
            --no-default-suite
            --out /tmp/holsmt-large-external
            --mode parser-only
            --regression-dir "${HOLSMT_REGRESSION_DIR:-tools/external-benchmarks/local-regressions}"
          )
          if [ -n "${HOLSMT_LARGE_BENCHMARK_DIR:-}" ] && [ -d "${HOLSMT_LARGE_BENCHMARK_DIR}" ]; then
            args+=(--benchmark-dir "${HOLSMT_LARGE_BENCHMARK_DIR}")
          fi
          if [ -n "${HOLSMT_Z3_PROOF_DIR:-}" ] && [ -d "${HOLSMT_Z3_PROOF_DIR}" ]; then
            args+=(--z3-proof-dir "${HOLSMT_Z3_PROOF_DIR}")
          fi
          python3 tools/run_conformance_suite.py "${args[@]}"
