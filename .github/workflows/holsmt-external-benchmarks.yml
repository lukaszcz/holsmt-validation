name: holsmt-external-benchmarks

on:
  pull_request:
    branches:
      - "develop"
    paths:
      - "tools/**"
      - ".github/workflows/holsmt-external-benchmarks.yml"
  push:
    branches:
      - "master"
      - "develop"
    paths:
      - "tools/**"
      - ".github/workflows/holsmt-external-benchmarks.yml"
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

jobs:
  curated-small:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Provision cvc5 for the HO oracle slice
        run: |
          sudo apt-get update
          sudo apt-get install -y cvc5
          cvc5 --version

      - name: Validate pinned external benchmark importer
        run: python3 tools/import_external_benchmarks.py --check >/tmp/holsmt-pinned-external-manifest.json

      - name: Run curated external benchmark slice
        run: |
          python3 tools/run_conformance_suite.py \
            --no-default-suite \
            --benchmark-dir tools/external-benchmarks/curated-small \
            --mode parser-only \
            --out /tmp/holsmt-curated-external

      - name: Run curated higher-order cvc5 oracle slice
        run: |
          python3 tools/run_conformance_suite.py \
            --no-default-suite \
            --benchmark-dir tools/external-benchmarks/ho \
            --mode parser-only \
            --mode cvc5-oracle \
            --out /tmp/holsmt-curated-ho-cvc5

      - name: Run lowerable higher-order Z3_TAC spot checks
        run: |
          python3 tools/run_conformance_suite.py \
            --no-default-suite \
            --benchmark-dir \
              tools/external-benchmarks/ho/tptp_function_extensionality.smt2 \
            --benchmark-dir \
              tools/external-benchmarks/ho/tptp_lambda_beta.smt2 \
            --mode parser-only \
            --mode z3-tac \
            --out /tmp/holsmt-curated-ho-z3-tac

      - name: Run HolSmt tool tests
        run: python3 -m unittest tools/tests/test_run_conformance_suite.py

  scheduled-large:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      HOLSMT_LARGE_BENCHMARK_DIR: ${{ vars.HOLSMT_LARGE_BENCHMARK_DIR }}
      HOLSMT_Z3_PROOF_DIR: ${{ vars.HOLSMT_Z3_PROOF_DIR }}
      HOLSMT_REGRESSION_DIR: ${{ vars.HOLSMT_REGRESSION_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run configured large external benchmark slice
        run: |
          args=(
            --no-default-suite
            --out /tmp/holsmt-large-external
            --mode parser-only
            --regression-dir "${HOLSMT_REGRESSION_DIR:-tools/external-benchmarks/local-regressions}"
          )
          if [ -n "${HOLSMT_LARGE_BENCHMARK_DIR:-}" ] && [ -d "${HOLSMT_LARGE_BENCHMARK_DIR}" ]; then
            args+=(--benchmark-dir "${HOLSMT_LARGE_BENCHMARK_DIR}")
          fi
          if [ -n "${HOLSMT_Z3_PROOF_DIR:-}" ] && [ -d "${HOLSMT_Z3_PROOF_DIR}" ]; then
            args+=(--z3-proof-dir "${HOLSMT_Z3_PROOF_DIR}")
          fi
          python3 tools/run_conformance_suite.py "${args[@]}"
